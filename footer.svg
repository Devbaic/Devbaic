</defs>
<style>text{font-family:'Segoe UI','Courier New',monospace} .m{fill:#9ca3af} .w{fill:#e5e7eb} .k{fill:#e879f9;font-weight:700}</style><rect width="900" height="120" rx="14" fill="url(#bg)"/><ellipse cx="450" cy="60" rx="300" ry="60" fill="url(#gl)"><animate attributeName="opacity" values=".4;1;.4" dur="3s" repeatCount="indefinite"/></ellipse><text x="450" y="70" text-anchor="middle" font-size="40" font-weight="900" letter-spacing="14" fill="url(#tx)" filter="url(#glow)">ARISE<animate attributeName="opacity" values="1;.6;1" dur="2.4s" repeatCount="indefinite"/></text><text x="450" y="98" text-anchor="middle" font-size="12" letter-spacing="5" class="m">THANKS FOR VISITING · LUY</text></svg>